<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bagel Fat One"; src: url("assets/fonts/BagelFatOne-latin.woff2") format("woff2"); }
      @font-face { font-family: "Modak"; src: url("assets/fonts/Modak-latin.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FFE9A0; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FFE9A0; }
      .veil { position: absolute; left: 0; top: 0; width: 1080px; height: 560px; background: linear-gradient(180deg, rgba(255,233,160,.85) 0%, rgba(255,233,160,0) 100%); z-index: 8; }
      .txt { position: absolute; left: 0; width: 1080px; text-align: center; font-family: "Bagel Fat One", sans-serif; opacity: 0; color: #1F5F93; -webkit-text-stroke: 14px #fff; paint-order: stroke fill; line-height: 1.05; }
      #cta { position: absolute; left: 0; top: 1560px; width: 1080px; text-align: center; opacity: 0; }
      #cta span { display: inline-block; font-family: "Bagel Fat One", sans-serif; font-size: 54px; color: #1F5F93; background: #fff; padding: 18px 46px 24px; border-radius: 999px; border: 8px solid #FFD84D; }
      #logo { position: absolute; left: 45px; top: 110px; width: 150px; height: 150px; opacity: 0; }
      .card { position: absolute; left: 0; width: 1080px; overflow: hidden; background: #000; border-radius: 0; }
      .card video, .card img { position: absolute; display: block; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.0" data-width="1080" data-height="1920">
      <!-- 0–0,5 s: el último fotograma del timelapse (pulpo impreso terminado) -->
      <img id="ini" class="clip" src="assets/final-frame.png" alt="" data-start="0" data-duration="0.5" data-track-index="1" style="position:absolute;left:-977px;top:0;width:2720px;height:1920px;z-index:5" />
      <video id="v" class="clip" src="assets/impresion-azul.mp4" data-start="0.5" data-duration="7.3" data-track-index="1" data-playback-rate="3.1232876712328768" muted playsinline style="position:absolute;left:-977px;top:0;width:2720px;height:1920px;z-index:6"></video>
      <img id="fin" class="clip" src="assets/final-frame.png" alt="" data-start="7.8" data-duration="1.2" data-track-index="1" style="position:absolute;left:-977px;top:0;width:2720px;height:1920px;z-index:6" />
      <div id="veil" class="veil clip" data-start="0" data-duration="9.0" data-track-index="3"></div>
      <div id="t0" class="txt clip" data-start="0.5" data-duration="3.2" data-track-index="4" style="top:200px;font-size:88px;z-index:10">Regarde-le<br>naître</div>
      <div id="t1" class="txt clip" data-start="3.9" data-duration="3.0" data-track-index="4" style="top:230px;font-size:88px;z-index:10">Couche par<br>couche</div>
      <div id="t2" class="txt clip" data-start="7.0" data-duration="2.0" data-track-index="4" style="top:230px;font-size:88px;z-index:10">1/6 · Violette</div>
      <div id="cta" class="clip" data-start="7.5" data-duration="1.5" data-track-index="4" style="z-index:10"><span>Suis-nous pour le 2/6 🐙</span></div>
      <img id="logo" class="clip" src="assets/logo-renardlab.png" alt="RenardLab Impression 3D" data-start="0" data-duration="9.0" data-track-index="4" style="z-index:12" />
      <audio id="p0" class="clip" src="assets/sfx/burbuja-pop_doble.mp3" data-start="0.02" data-duration="0.65" data-track-index="6" data-volume="0.95"></audio>
      <audio id="e0" class="clip" src="assets/sfx/burbuja-pop_a.mp3" data-start="0.6" data-duration="0.34" data-track-index="7" data-volume="0.6"></audio>
      <audio id="e1" class="clip" src="assets/sfx/burbuja-pop_b.mp3" data-start="2.9" data-duration="0.34" data-track-index="8" data-volume="0.6"></audio>
      <audio id="e2" class="clip" src="assets/sfx/burbuja-pop_c.mp3" data-start="4.82" data-duration="0.34" data-track-index="9" data-volume="0.6"></audio>
      <audio id="e3" class="clip" src="assets/sfx/burbuja-pop_a.mp3" data-start="6.84" data-duration="0.34" data-track-index="10" data-volume="0.6"></audio>
      <audio id="pend" class="clip" src="assets/sfx/burbuja-pop_doble.mp3" data-start="7.7" data-duration="0.65" data-track-index="12" data-volume="0.9"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t0", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.5);
      tl.to("#t0", { opacity: 0, duration: 0.15 }, 3.55);
      tl.fromTo("#t1", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 3.9);
      tl.to("#t1", { opacity: 0, duration: 0.15 }, 6.75);
      tl.fromTo("#t2", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 7.0);
      tl.fromTo("#cta", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, 7.5);
      tl.fromTo("#logo", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)" }, 0.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
