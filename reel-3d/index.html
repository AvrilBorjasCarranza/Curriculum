<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bagel Fat One"; src: url("assets/fonts/BagelFatOne-latin.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Modak"; src: url("assets/fonts/Modak-latin.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #BAE6FD; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #BAE6FD; }
      /* fondo alto 3D (1080x2700) renderizado en Blender; la cámara baja 780 px durante la caída */
      #bg { position: absolute; left: 0; top: 0; width: 1080px; height: 2700px; }
      #bg img { display: block; width: 1080px; height: 2700px; }
      #front { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .layer { position: absolute; display: block; opacity: 0; }
      #octo { position: absolute; left: 328px; top: 1318px; width: 424px; height: 424px; opacity: 0; }
      #octo img { width: 100%; height: 100%; display: block; }
      .txt { position: absolute; left: 0; width: 1080px; text-align: center; font-family: "Bagel Fat One", sans-serif; opacity: 0; }
      .hook { top: 290px; font-size: 84px; line-height: 1; color: #1F5F93; -webkit-text-stroke: 14px #fff; paint-order: stroke fill; }
      .title { top: 285px; font-family: Modak, "Bagel Fat One", sans-serif; font-size: 190px; line-height: 1.05; -webkit-text-stroke: 24px #fff; paint-order: stroke fill; filter: drop-shadow(0 10px 0 #fff); }
      .title .a { color: #CD575B; } .title .b { color: #8DD0F7; }
      .tag { top: 505px; font-size: 52px; color: #1F5F93; -webkit-text-stroke: 10px #fff; paint-order: stroke fill; }
      .banner { position: absolute; left: 0; top: 515px; width: 1080px; text-align: center; opacity: 0; }
      .banner span { display: inline-block; font-family: "Bagel Fat One", sans-serif; font-size: 58px; white-space: nowrap; color: #fff; background: #CD575B; padding: 16px 50px 22px; border-radius: 999px; border: 10px solid #fff; }
      .old { top: 655px; font-size: 88px; color: #1F5F93; -webkit-text-stroke: 12px #fff; paint-order: stroke fill; }
      .old span { position: relative; display: inline-block; }
      #strike { position: absolute; left: -16px; top: 52%; height: 14px; width: 0; background: #CD575B; border-radius: 8px; transform: rotate(-8deg); transform-origin: left center; }
      .lanc { top: 790px; font-size: 44px; color: #1F5F93; -webkit-text-stroke: 10px #fff; paint-order: stroke fill; letter-spacing: .04em; }
      .new { top: 830px; font-family: Modak, "Bagel Fat One", sans-serif; font-size: 200px; line-height: 1; color: #CD575B; -webkit-text-stroke: 26px #fff; paint-order: stroke fill; filter: drop-shadow(0 8px 0 #fff); }
      .until { top: 1040px; font-size: 44px; color: #1F5F93; -webkit-text-stroke: 10px #fff; paint-order: stroke fill; }
      .cta { position: absolute; left: 0; top: 1118px; width: 1080px; text-align: center; opacity: 0; }
      .cta span { display: inline-block; font-family: "Bagel Fat One", sans-serif; font-size: 52px; color: #1F5F93; background: #FFD84D; padding: 18px 46px 24px; border-radius: 999px; border: 8px solid #fff; }
      #logo { position: absolute; left: 45px; top: 110px; width: 160px; height: 160px; opacity: 0; }
      #flash { position: absolute; left: 340px; top: 1540px; width: 400px; height: 400px; border-radius: 50%; border: 18px solid #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.0" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="10.0" data-track-index="0" style="z-index:1">
        <img src="assets/escena/fondo.png" alt="" />
      </div>
      <div id="front" class="clip" data-start="0" data-duration="10.0" data-track-index="1" style="z-index:5">
        <img id="Ls1" class="layer" src="assets/escena/capa_s1.png" alt="" style="left:18px;top:1311px;width:394px;height:256px;transform-origin:112px 243px;" />
        <img id="Ls2" class="layer" src="assets/escena/capa_s2.png" alt="" style="left:181px;top:1249px;width:329px;height:214px;transform-origin:94px 205px;" />
        <img id="Ls3" class="layer" src="assets/escena/capa_s3.png" alt="" style="left:453px;top:1178px;width:325px;height:204px;transform-origin:87px 197px;" />
        <img id="Ls4" class="layer" src="assets/escena/capa_s4.png" alt="" style="left:702px;top:1263px;width:347px;height:216px;transform-origin:103px 207px;" />
        <img id="Ls5" class="layer" src="assets/escena/capa_s5.png" alt="" style="left:817px;top:1289px;width:263px;height:253px;transform-origin:133px 241px;" />
        <img id="Lmorado" class="layer" src="assets/escena/capa_morado.png" alt="" style="left:231px;top:1464px;width:849px;height:345px;transform-origin:309px 284px;" />

        <div id="flash"></div>
      </div>

        <video id="pulpo" class="clip" src="assets/pulpo/giro.webm" data-start="0" data-duration="3.1" data-track-index="3" muted playsinline style="position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:7"></video>
        <img id="pulpo-fin" class="clip" src="assets/pulpo/final.png" alt="" data-start="3.1" data-duration="6.9" data-track-index="3" style="position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:7" />
      <div id="hook" class="txt hook clip" data-start="0" data-duration="10.0" data-track-index="2" style="z-index:10">Quel est ton mood ?</div>
      <img id="logo" class="clip" src="assets/logo-renardlab.png" alt="RenardLab Impression 3D" data-start="0" data-duration="10.0" data-track-index="2" style="z-index:12" />
      <div id="title" class="txt title clip" data-start="0" data-duration="10.0" data-track-index="2" style="z-index:11"><span class="a">Octo</span><span class="b">Mood</span></div>
      <div id="tag" class="txt tag clip" data-start="0" data-duration="10.0" data-track-index="2" style="z-index:11">5 couleurs + 1 secret</div>
      <div id="banner" class="banner clip" data-start="0" data-duration="10.0" data-track-index="2" style="z-index:11"><span>PRÉCOMMANDE OUVERTE</span></div>
      <div id="old" class="txt old clip" data-start="0" data-duration="10.0" data-track-index="2" style="z-index:11"><span>14,99 €<i id="strike"></i></span></div>
      <div id="lanc" class="txt lanc clip" data-start="0" data-duration="10.0" data-track-index="2" style="z-index:11">PRIX DE LANCEMENT</div>
      <div id="new" class="txt new clip" data-start="0" data-duration="10.0" data-track-index="2" style="z-index:11">12,99 €</div>
      <div id="until" class="txt until clip" data-start="0" data-duration="10.0" data-track-index="2" style="z-index:11">Jusqu’au 20 janvier · 20 pièces seulement</div>
      <div id="cta" class="cta clip" data-start="0" data-duration="10.0" data-track-index="2" style="z-index:11"><span>Écris-nous en DM · @renardlab3d</span></div>

      <audio id="music" class="clip" src="assets/bgm/music.mp3" data-start="0" data-duration="10.0" data-track-index="5" data-volume="0.72"></audio>
      <audio id="sfx-pop0" class="clip" src="assets/sfx/burbuja-pop_doble.mp3" data-start="0.05" data-duration="0.65" data-track-index="6" data-volume="0.95"></audio>
      <audio id="sfx-fall" class="clip" src="assets/sfx/hush-caida.mp3" data-start="1.75" data-duration="0.8" data-track-index="6" data-volume="0.9"></audio>
      <audio id="sfx-land" class="clip" src="assets/sfx/burbuja-pop_c.mp3" data-start="2.52" data-duration="0.34" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-p1" class="clip" src="assets/sfx/burbuja-pop_a.mp3" data-start="2.95" data-duration="0.34" data-track-index="6" data-volume="0.8"></audio>
      <audio id="sfx-p2" class="clip" src="assets/sfx/burbuja-pop_b.mp3" data-start="3.1" data-duration="0.34" data-track-index="7" data-volume="0.8"></audio>
      <audio id="sfx-p3" class="clip" src="assets/sfx/burbuja-pop_c.mp3" data-start="3.25" data-duration="0.34" data-track-index="8" data-volume="0.8"></audio>
      <audio id="sfx-p4" class="clip" src="assets/sfx/burbuja-pop_a.mp3" data-start="3.4" data-duration="0.34" data-track-index="9" data-volume="0.8"></audio>
      <audio id="sfx-p5" class="clip" src="assets/sfx/burbuja-pop_b.mp3" data-start="3.6" data-duration="0.34" data-track-index="10" data-volume="0.95"></audio>
      <audio id="sfx-title" class="clip" src="assets/sfx/burbuja-pop_doble.mp3" data-start="4.0" data-duration="0.65" data-track-index="6" data-volume="1.0"></audio>
      <audio id="sfx-shift" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="5.85" data-duration="0.57" data-track-index="6" data-volume="0.6"></audio>
      <audio id="sfx-ban" class="clip" src="assets/sfx/burbuja-pop_a.mp3" data-start="6.0" data-duration="0.34" data-track-index="7" data-volume="0.95"></audio>
      <audio id="sfx-old" class="clip" src="assets/sfx/burbuja-pop_c.mp3" data-start="6.6" data-duration="0.34" data-track-index="8" data-volume="0.85"></audio>
      <audio id="sfx-strike" class="clip" src="assets/sfx/burbuja-pop_b.mp3" data-start="7.12" data-duration="0.34" data-track-index="9" data-volume="0.8"></audio>
      <audio id="sfx-new" class="clip" src="assets/sfx/burbuja-pop_doble.mp3" data-start="7.5" data-duration="0.65" data-track-index="10" data-volume="1.0"></audio>
      <audio id="sfx-until" class="clip" src="assets/sfx/burbuja-pop_a.mp3" data-start="7.7" data-duration="0.34" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/burbuja-pop_doble.mp3" data-start="7.85" data-duration="0.65" data-track-index="12" data-volume="0.9"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set("#hook", { opacity: 1 }, 0);
      tl.to("#hook", { opacity: 0, duration: 0.2 }, 3.7);
      // ---- 1,9-2,6 s: cae y la cámara baja a la playa
      tl.to("#bg", { y: -780, duration: 0.7, ease: "power2.in" }, 1.9);

      // ---- 2,9-3,7 s: las 5 siluetas aparecen detrás
      [["#Ls1", 2.95], ["#Ls2", 3.1], ["#Ls4", 3.25], ["#Ls5", 3.4], ["#Ls3", 3.6]].forEach(([id, t]) => {
        tl.fromTo(id, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2.2)", immediateRender: false }, t);
      });
      // ---- 4 s: logo + título
      tl.fromTo("#logo", { opacity: 0, scale: 0.5, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.7)" }, 4.0);
      tl.fromTo("#title", { opacity: 0, scale: 0.4, y: -60 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(2)" }, 4.0);
      tl.fromTo("#tag", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 4.2);
      // ---- 5,85 s: el rótulo pequeño se va antes de la pancarta
      tl.to("#tag", { opacity: 0, duration: 0.15 }, 5.85);
      // ---- 6 s: PRÉCOMMANDE OUVERTE
      tl.fromTo("#banner", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 6.0);
      // ---- 6,6-7,5 s: precio viejo, se tacha, precio de lanzamiento
      tl.fromTo("#old", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, 6.6);
      tl.to("#strike", { width: 290, duration: 0.3, ease: "power2.out" }, 7.1);
      tl.to("#old", { opacity: 0.55, duration: 0.2 }, 7.45);
      tl.fromTo("#lanc", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 7.4);
      tl.fromTo("#new", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 7.5);
      // ---- 7,7-7,9 s: fecha, unidades, DM (≥ 2 s en pantalla; el acorde final llega a los 8,0 s)
      tl.fromTo("#until", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 7.7);
      tl.fromTo("#cta", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 7.85);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
